[package]
name = "worktree"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baleen37/worktree"
homepage = "https://github.com/baleen37/worktree"
description = "A Git worktree switcher for creating, reusing, listing, and safely removing worktrees."

[[bin]]
name = "wt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.16"
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
expectrl = "0.9"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
