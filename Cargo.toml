[package]
name = "worktree"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baleen37/worktree"

[[bin]]
name = "wt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.16"
dialoguer = { version = "0.12", features = ["fuzzy-select"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
expectrl = "0.9"
